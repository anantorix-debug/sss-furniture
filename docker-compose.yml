version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sss
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: mysql://root:root@db:3306/sss
      NODE_ENV: development
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3001
      SUPERADMIN_NAME: Super Admin
      SUPERADMIN_EMAIL: admin@sss.com
      SUPERADMIN_PASSWORD: ChangeMe123!
      WHATSAPP_ENABLED: "true"
      WWEBJS_AUTH_PATH: .wwebjs_auth
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_DOWNLOAD: "true"
      WHATSAPP_MIN_DELAY_MS: 4000
      WHATSAPP_MAX_DELAY_MS: 9000
      WHATSAPP_MAX_PER_RECIPIENT_PER_DAY: 5
      WHATSAPP_MAX_PER_HOUR: 30
      WHATSAPP_MAX_QUEUE_DEPTH: 50
      WHATSAPP_SEND_TIMEOUT_MS: 30000
      WHATSAPP_LID_RESOLUTION_TIMEOUT_MS: 8000
      PUPPETEER_ARGS: "--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./data/whatsapp-session:/app/data/whatsapp-session
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:4000/api/auth/me', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3001:3000"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api

volumes:
  db_data:
